[project]
name = "telseq"
version = "0.0.1"
description = "Estimate telomere length from whole genome sequencing data (BAMs)"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "GPL-3.0"}
authors = [
    {name = "Zhihao Ding", email = "zhihao.ding@gmail.com"}
]
dependencies = [
    "pysam>=0.22.0",
]

[project.scripts]
telseq = "telseq.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telseq"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
